# =============================================================================
# Cross-session EEG classification pipeline — default configuration
# =============================================================================
#
# Quick reference (uncomment/swap as needed):
#
#   Features:    logvar | CSP | TS
#   Classifiers: lda | svm_linear | svm_radial | el | lr | lgbm | elm | catboost | mdm
#   DA methods:  none | sa | tca | pt | coral
#   Distances:   mmd | wasserstein | energy | geodesic | mahalanobis
#
# =============================================================================

# ── Paths ────────────────────────────────────────────────────────────────────
# Ubuntu
# data_dir: "/home/yiming/Desktop/WORK/EEG_MotorImagery"
#result_dir: "/home/yiming/Desktop/WORK/result"

# Mac (uncomment these, comment out Ubuntu paths above)
data_dir: "/Users/yiming/Documents/WORK/EEG_MotorImagery"
result_dir: "/Users/yiming/Documents/WORK/results"

# ── Datasets ─────────────────────────────────────────────────────────────────
# bnci004      : BNCI2014_004, 9 subjects, 5 sessions each
# stieger2021  : Stieger2021, 62 subjects, 6-11 sessions each
# ma2020       : Ma2020, 25 subjects, 15 sessions each (right hand vs right elbow)
datasets:
#  - bnci004
#  - stieger2021
  - ma2020

# ── Pipelines ────────────────────────────────────────────────────────────────
# MAP                  : Merge & Adapt (supervised grid search)
# MMP_merge_then_adapt : Minimum-distance multi-source, weighted merge combiner
# MMP_moe              : Minimum-distance multi-source, mixture-of-experts combiner
# DWP                  : Distance-Weighted Pooling (soft-weighted full pool)
# BDP                  : Bridge-Domain proxy tuning (far → bridge)
# BDP_bridge_to_far    : Bridge-Domain proxy tuning (bridge → far)
pipelines:
  - MAP
  - DWP
  - MMP_merge_then_adapt
  - MMP_moe
  - BDP
  - BDP_bridge_to_far

# ── Method bank ──────────────────────────────────────────────────────────────
# smoke     : 1 config per pipeline, sanity test (~minutes)
# mini      : focused comparison: 2 features × 4 DA × 2 classifiers (16/pipeline, ~hours)
# fair      : full balanced space across pipelines (~days)
# practical : larger space with pipeline-specific pruning (~days)
method_mode: mini

# fixed_mmd : MMD only (faster, budget-aligned)
# multi     : MMD + Mahalanobis (more flexible)
dist_policy: fixed_mmd

# ── Cross-validation ─────────────────────────────────────────────────────────
nfolds_out: 5
nfolds_in: 3

# ── MAP settings ─────────────────────────────────────────────────────────────
# kfold    : session-level k-fold (feature fitted per fold, strictest)
# loso     : leave-one-session-out
# pairwise : all source->target session pairs
map_score: kfold
map_k_sess: 4            # number of session folds (kfold mode only)
map_n_repeats: 1         # repeated k-fold (kfold mode only)
map_shuffle_sessions: true
map_seed: 1

# ── MMP settings ─────────────────────────────────────────────────────────────
mmp_B_boot: 10           # bootstrap replicates for distance CI (use 200 for production)

# ── Execution ────────────────────────────────────────────────────────────────
n_cores: 5              # subject-level parallelism (1 = sequential)
resume: true             # skip subjects with existing results
epsilon: 1.0e-6
seed: 2025
verbose: false           # false = suppress MNE/CSP/pyriemann logs, show only progress bars
